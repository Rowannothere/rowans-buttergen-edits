name: PyInstaller build

# Windows exe builds. Every push to dev, stable or exe-build makes a build under Actions
# (downloadable through nightly.link); a version tag also puts the zip on that tag's release page.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - stable
      - exe-build
    tags:
      - "v*"
    paths-ignore:
      - ".github/workflows/build-docs.yml"
      - "docs/**"
      - "docs-resources/**"
      - "mkdocs.yml"
      - "Dockerfile"
      - "README.md"
      - "readme-images/**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Buttergen_Win64
            python_version: "3.12"
            python_arch: "x64"
          # Linux and macOS later (macOS needs someone with a Mac to test):
          # - os: ubuntu-22.04
          #   artifact_name: Buttergen_Linux64
          # - os: macos-15-intel
          #   artifact_name: Buttergen_macOS64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          prune-cache: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.python_arch }}
      - name: Install Visual Studio Build Tools (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: microsoft/setup-msbuild@v3
      - name: Install dependencies
        run: uv sync --group build --extra discord
      # A self-built bootloader gets fewer antivirus false positives than the stock one.
      # Same version as uv.lock, and --no-sync below so uv doesn't put the stock one back.
      - name: Build PyInstaller bootloader
        run: |
          PYI_VERSION=$(uv run --no-sync python -c "import PyInstaller; print(PyInstaller.__version__)")
          git clone --depth 1 --branch "v$PYI_VERSION" https://github.com/pyinstaller/pyinstaller.git
          cd pyinstaller/bootloader
          python ./waf all
          cd ../../
          uv pip install ./pyinstaller
      # version.ini stays as it is in the repo: the exe reports the branch's own version and
      # update channel.
      - name: Run PyInstaller
        run: uv run --no-sync pyinstaller Clangen.spec
        env:
          IS_RELEASE: 1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
      - name: Zip for the release page
        if: startsWith(github.ref, 'refs/tags/') && startsWith(matrix.os, 'windows')
        shell: powershell
        run: Compress-Archive -Path dist/Buttergen -DestinationPath ${{ matrix.artifact_name }}.zip
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}.zip
